<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة التقييمات التفاعلية - الصف الأول الثانوي</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --secondary: #0ea5e9;
            --bg: #f1f5f9;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border: #cbd5e1;
            --success: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            line-height: 1.7;
            position: relative;
            overflow-x: hidden;
        }

        header {
            background: linear-gradient(135deg, #4f46e5, #0ea5e9);
            color: white;
            padding: 2.5rem 1rem;
            text-align: center;
            box-shadow: 0 10px 25px -5px rgba(79, 70, 229, 0.2);
            border-bottom-left-radius: 30px;
            border-bottom-right-radius: 30px;
            margin-bottom: 2rem;
        }

        header h1 {
            font-size: 2.4rem;
            font-weight: 900;
            margin-bottom: 0.5rem;
        }

        header p {
            font-size: 1.2rem;
            opacity: 0.95;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 0 1rem 8rem;
            position: relative;
            z-index: 1;
        }

        .section-category-header {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            padding: 1.2rem 2rem;
            border-radius: 14px;
            font-size: 1.7rem;
            font-weight: 900;
            margin: 2.5rem 0 1.5rem;
            box-shadow: 0 4px 15px rgba(79, 70, 229, 0.2);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        /* كارت السؤال (div) */
        .card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 2rem;
            margin-bottom: 1.5rem;
            border: 1px solid var(--border);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            transition: box-shadow 0.3s ease, border-color 0.3s ease;
            position: relative; /* مهم جداً عشان طبقة الرسم تثبت جوه الكارت */
            overflow: hidden;
        }

        .card:hover {
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08);
            border-color: #94a3b8;
        }

        /* طبقة الرسم الخاصة بكل كارت لضمان عمل القلم 100% وثبات الكتابة */
        .card-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }

        body.draw-mode-active .card-canvas {
            pointer-events: auto;
            cursor: crosshair;
        }

        /* تقسيمة السؤال مع الصورة (السؤال يمين والصورة شمال) */
        .question-header-row {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 1.5rem;
            margin-bottom: 1.5rem;
        }

        .question-text {
            font-size: 1.25rem;
            font-weight: 800;
            color: #0f172a;
            line-height: 1.8;
            flex: 1; /* ياخد المساحة المتاحة ويفرد السؤال */
        }

        /* صندوق الصورة على اليسار */
        .question-image-box {
            width: 260px;
            min-height: 160px;
            flex-shrink: 0;
            background: #f8fafc;
            border: 2px dashed #94a3b8;
            border-radius: 12px;
            padding: 0.75rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: #475569;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .question-image-box img {
            max-width: 100%;
            max-height: 200px;
            border-radius: 8px;
            object-fit: contain;
            display: none;
        }

        .question-image-box.has-src {
            border: 1px solid var(--border);
            background: #ffffff;
            padding: 0.4rem;
        }

        .question-image-box.has-src img {
            display: block;
        }

        .question-image-box.has-src .placeholder-info {
            display: none;
        }

        .placeholder-info svg {
            width: 32px;
            height: 32px;
            fill: var(--primary);
            margin-bottom: 0.5rem;
        }

        /* الاختيارات: 2 جنب بعض وتحتهم 2 (شبكة 2×2) */
        .options-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1rem;
            position: relative;
            z-index: 2;
        }

        @media (max-width: 700px) {
            .question-header-row {
                flex-direction: column;
            }
            .question-image-box {
                width: 100%;
            }
            .options-grid {
                grid-template-columns: 1fr;
            }
        }

        .option-btn {
            background: #f8fafc;
            border: 2px solid var(--border);
            padding: 1rem 1.25rem;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            text-align: right;
            color: var(--text-main);
            display: flex;
            align-items: center;
        }

        .option-btn:hover {
            border-color: var(--primary);
            background: #eef2ff;
        }

        .option-btn.selected {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
        }

        /* مربع الأسئلة المقالية */
        .essay-input {
            width: 100%;
            min-height: 120px;
            padding: 1rem;
            border: 2px solid var(--border);
            border-radius: 10px;
            font-size: 1.1rem;
            resize: vertical;
            transition: border-color 0.2s;
            background: #f8fafc;
            position: relative;
            z-index: 2;
        }

        .essay-input:focus {
            outline: none;
            background: #ffffff;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        /* شريط أدوات القلم العائم */
        .tools-panel {
            position: fixed;
            bottom: 1.5rem;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(10px);
            padding: 0.75rem 1.5rem;
            border-radius: 50px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.2), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
            display: flex;
            gap: 0.75rem;
            align-items: center;
            z-index: 9999;
            border: 2px solid var(--border);
            flex-wrap: wrap;
            justify-content: center;
            width: max-content;
            max-width: 95vw;
        }

        .tool-btn {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            border: 2px solid white;
            outline: 2px solid transparent;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s, outline-color 0.2s;
            box-shadow: 0 2px 5px rgba(0,0,0,0.15);
            font-size: 1.2rem;
        }
        
        .tool-btn.active {
            outline-color: var(--text-main);
            transform: scale(1.15);
        }

        .tool-btn:hover {
            transform: scale(1.1);
        }

        .btn-text {
            background: var(--text-main);
            color: white;
            padding: 0.6rem 1.25rem;
            border-radius: 25px;
            border: none;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-text:hover {
            background: #334155;
            transform: translateY(-1px);
        }

        .toggle-draw {
            background: var(--primary);
        }

        .toggle-draw.active {
            background: #ef4444;
        }

        .divider {
            width: 2px;
            height: 28px;
            background: #cbd5e1;
            margin: 0 4px;
        }
    </style>
</head>
<body>

    <header>
        <h1>المراجعة الشاملة (شهر أكتوبر)</h1>
        <p>الصف الأول الثانوي (بكالوريا وعام) - الفصل الدراسي الأول - مادة التاريخ</p>
    </header>

    <div class="container">
        
        <!-- القسم الأول: أسئلة الاختيار من متعدد -->
        <div class="section-category-header">

        </div>
        <div id="mcq-section-container"></div>

        </div>
        <div id="essay-section-container"></div>

    </div>

    <!-- شريط الأدوات للرسم والشرح -->
    <div class="tools-panel">

        <div class="divider"></div>
        
        <!-- الألوان -->
        <button class="tool-btn active" style="background: #ef4444;" onclick="setTool('pen', this, '#ef4444')" title="قلم أحمر"></button>
        <button class="tool-btn" style="background: #2563eb;" onclick="setTool('pen', this, '#2563eb')" title="قلم أزرق"></button>
        <button class="tool-btn" style="background: #10b981;" onclick="setTool('pen', this, '#10b981')" title="قلم أخضر"></button>
        <button class="tool-btn" style="background: #0f172a;" onclick="setTool('pen', this, '#0f172a')" title="قلم أسود"></button>
        
        <!-- الأستيكة (الممحاة) -->
        <button class="tool-btn" style="background: #f1f5f9; border-color: #cbd5e1;" onclick="setTool('eraser', this, null)" title="أستيكة لمسح جزء محدد">🧽</button>
        
        <div class="divider"></div>
        
        <!-- مسح الكل -->
        <button class="btn-text" style="background: #64748b;" onclick="clearAllCanvases()">مسح السبورة بالكامل 🗑️</button>
    </div>

        const essaysData = [
            'دلل علي صدق العبارة تاريخيًا : الشرق منارة الحضارة الإنسانية في العصور القديمة',

            'دلل علي صحة العبارة تاريخيا :- تعد الاوستراكا مصدرا هاما لدراسة تاريخ الطبقة الوسطي والفقيرة بمصر القديمة .',

            'حدد العلاقة بين : أهمية دراسة التاريخ وتواصل الحضارات .',
            'أيد صحة العبارة : أدي قيام الثورة الصناعية إلي الاستعمار الأوروبي في شمال إفريقيا',
            'بم تفسر : نشأة حضارات العالم القديم ؟',
            'أيد صحة العبارة : تُعد مصر حلقة وصل بين شعوب العالم القديم ؟',
            '" لم يكن النيل مصدر اقتصادي للمصريين فقط بل أمتد أثره لاكتساب المصريين صفات اجتماعية عظيمة " . أثبت بالشواهد التاريخية صحة العبارة ؟',
            'ما رأيك في : دور المصري القديم في استثمار ما هيأه الله له لقيام الحضارة ؟',
            'حدد العلاقة بين : موقع مصر الجغرافي وقيام الحضارة المصرية ؟',

        ];

        // --- بناء وعرض الأسئلة ---
        const mcqContainer = document.getElementById('mcq-section-container');
        const essayContainer = document.getElementById('essay-section-container');

        mcqsData.forEach((mcq, index) => {
            let imageBoxHtml = '';
            // يظهر صندوق الصورة فقط للأسئلة التي تحتوي على hasImage: true
            if (mcq.hasImage) {
                const hasSrcClass = (mcq.imageSrc && mcq.imageSrc.trim() !== '') ? 'has-src' : '';
                imageBoxHtml = `
                    <div class="question-image-box ${hasSrcClass}">
                        <div class="placeholder-info">
                            <svg viewBox="0 0 24 24"><path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/></svg>
                            <div>${mcq.imageHint}</div>
                            <small style="color:#94a3b8; display:block; margin-top:4px;">(أضف مسار الصورة في imageSrc بالكود)</small>
                        </div>
                        <img src="${mcq.imageSrc}" alt="${mcq.imageHint}" />
                    </div>
                `;
            }

            let optionsHtml = '';
            mcq.options.forEach((opt) => {
                optionsHtml += `<button class="option-btn" onclick="selectOption(this)">${opt}</button>`;
            });

            const card = document.createElement('div');
            card.className = 'card';

            `;
            mcqContainer.appendChild(card);
        });

        essaysData.forEach((essay, index) => {
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                <div class="question-header-row">
                    <div class="question-text">${index + 1}- ${essay}</div>
                </div>
                <textarea class="essay-input" placeholder=""></textarea>
                <canvas class="card-canvas"></canvas>
            `;
            essayContainer.appendChild(card);

        // --- التفاعل مع الاختيارات ---
        function selectOption(element) {
            const parentGrid = element.parentElement;
            const buttons = parentGrid.getElementsByClassName('option-btn');
            for (let btn of buttons) {
                btn.classList.remove('selected');
            }
            element.classList.add('selected');
        }

        // --- نظام القلم والسبورة الذكية لكل كارت ---
        let isDrawModeActive = false;
        let isEraser = false;
        let currentColor = '#ef4444';

        function initCanvases() {
            const canvases = document.querySelectorAll('.card-canvas');
            canvases.forEach((canvas) => {
                const card = canvas.parentElement;
                canvas.width = card.offsetWidth;
                canvas.height = card.offsetHeight;

                const ctx = canvas.getContext('2d');
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';

                let isDrawing = false;

                function getPos(e) {
                    const rect = canvas.getBoundingClientRect();
                    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                    return {
                        x: clientX - rect.left,
                        y: clientY - rect.top
                    };
                }

                function startDraw(e) {
                    if (!isDrawModeActive) return;
                    if (e.touches && e.touches.length > 1) return; // السماح بالتمرير بإصبعين

                    isDrawing = true;
                    const pos = getPos(e);
                    ctx.beginPath();
                    ctx.moveTo(pos.x, pos.y);
                    drawMove(e);
                }

                function drawMove(e) {
                    if (!isDrawing || !isDrawModeActive) return;
                    if (e.touches && e.touches.length > 1) {
                        isDrawing = false;
                        ctx.beginPath();
                        return;
                    }

                    const pos = getPos(e);
                    if (isEraser) {
                        ctx.globalCompositeOperation = 'destination-out';
                        ctx.lineWidth = 28; // حجم الأستيكة
                    } else {
                        ctx.globalCompositeOperation = 'source-over';
                        ctx.lineWidth = 3.5; // حجم القلم
                        ctx.strokeStyle = currentColor;
                    }

                    ctx.lineTo(pos.x, pos.y);
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.moveTo(pos.x, pos.y);
                }

                function endDraw() {
                    if (!isDrawing) return;
                    isDrawing = false;
                    ctx.beginPath();
                }

                // أحداث الماوس
                canvas.addEventListener('mousedown', startDraw);
                canvas.addEventListener('mousemove', drawMove);
                window.addEventListener('mouseup', endDraw);

                // أحداث اللمس (الموبايل والتابلت)
                canvas.addEventListener('touchstart', (e) => {
                    if (isDrawModeActive && e.touches.length === 1) {
                        e.preventDefault(); // منع تحرك الشاشة بإصبع واحد أثناء الكتابة
                        startDraw(e);
                    }
                }, { passive: false });

                canvas.addEventListener('touchmove', (e) => {
                    if (isDrawModeActive && e.touches.length === 1) {
                        e.preventDefault();
                        drawMove(e);
                    }
                }, { passive: false });

                canvas.addEventListener('touchend', endDraw);
            });
        }

        // الحفاظ على الرسومات لو حجم الشاشة اتغير
        window.addEventListener('resize', () => {
            document.querySelectorAll('.card-canvas').forEach((canvas) => {
                const card = canvas.parentElement;
                if (canvas.width !== card.offsetWidth || canvas.height !== card.offsetHeight) {
                    const tempCanvas = document.createElement('canvas');
                    tempCanvas.width = canvas.width;
                    tempCanvas.height = canvas.height;
                    tempCanvas.getContext('2d').drawImage(canvas, 0, 0);

                    canvas.width = card.offsetWidth;
                    canvas.height = card.offsetHeight;
                    const ctx = canvas.getContext('2d');
                    ctx.lineCap = 'round';
                    ctx.lineJoin = 'round';
                    ctx.drawImage(tempCanvas, 0, 0);
                }
            });
        });

        window.addEventListener('load', initCanvases);
        setTimeout(initCanvases, 300);

        function toggleDrawing() {
            isDrawModeActive = !isDrawModeActive;
            const btn = document.getElementById('toggleDrawBtn');
            if (isDrawModeActive) {
                document.body.classList.add('draw-mode-active');
                btn.classList.add('active');
                btn.innerText = "إيقاف القلم (وضع التصفح والحل) 🛑";
            } else {
                document.body.classList.remove('draw-mode-active');
                btn.classList.remove('active');
                btn.innerText = "تفعيل قلم الشرح ✍️";
            }
        }

        function setTool(tool, element, color) {
            document.querySelectorAll('.tools-panel .tool-btn').forEach(b => b.classList.remove('active'));
            element.classList.add('active');
            
            if (tool === 'eraser') {
                isEraser = true;
            } else {
                isEraser = false;
                currentColor = color;
            }

            if (!isDrawModeActive) {
                toggleDrawing();
            }
        }

        function clearAllCanvases() {
            document.querySelectorAll('.card-canvas').forEach((canvas) => {
                const ctx = canvas.getContext('2d');
                ctx.clearRect(0, 0, canvas.width, canvas.height);
            });
        }
    </script>
